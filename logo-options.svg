<text x="560" y="95" fill="#645d54" font-family="Arial,sans-serif" font-size="15">A custom-tuned humanist sans pairs soft curves</text><text x="560" y="119" fill="#645d54" font-family="Arial,sans-serif" font-size="15">with precise spacing for a refined, approachable feel.</text>
