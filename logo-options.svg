<text x="560" y="95" fill="#716a61" font-family="Arial,sans-serif" font-size="15">Geometric, open letterforms give the mark a modern</text><text x="560" y="119" fill="#716a61" font-family="Arial,sans-serif" font-size="15">architectural feel while staying easy to read.</text>
</g>
