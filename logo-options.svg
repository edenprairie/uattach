<text x="560" y="95" fill="#716a61" font-family="Arial,sans-serif" font-size="15">A confident slab serif brings a crafted, established</text><text x="560" y="119" fill="#716a61" font-family="Arial,sans-serif" font-size="15">character and a more memorable brand voice.</text>
