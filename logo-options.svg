<text x="560" y="95" fill="#d0c9bd" font-family="Arial,sans-serif" font-size="15">A condensed industrial face adds strength and</text><text x="560" y="119" fill="#d0c9bd" font-family="Arial,sans-serif" font-size="15">authority, with a crisp equipment-label quality.</text>
